# Portal メトリクス設定
# CI: PORTAL_CONFIG シークレットに YAML を登録
# ローカル: .portal.yaml にコピーして使用

# キャッシュ用 SALT（省略時は毎回ランダム生成されキャッシュが無効になる）
# salt: "your-random-secret-string"

# Author フィルタ（省略時は全コードを集計）
# author:
#   emails:
#     - you@example.com
#     - 12345+you@users.noreply.github.com  # GitHub の noreply アドレス
#   names:              # email が使えない場合のフォールバック（任意）
#     - "Your Name"
#   github: "your-github-username"  # PR フィルタ用（任意）

repositories:
  # 自リポジトリ
  - repo: self
    # 日次活動から除外する初期投入などのコミット（任意、完全なSHA）
    # activityExcludeCommits:
    #   - "0123456789abcdef0123456789abcdef01234567"
    # 件名が一致するコミットを日次活動から除外（任意、正規表現）。bot の定期コミットなどに使う
    # activityExcludeSubjects:
    #   - '\[skip ci\]$'

  # 外部リポジトリ（alias でログ表示名を指定可能）
  # - repo: owner/private-repo
  #   alias: secret_repo1
  # - repo: owner/work-repo
  #   alias: work1
