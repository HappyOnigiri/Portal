name: Collect Metrics

on:
  workflow_dispatch:
    inputs:
      no-cache:
        description: "キャッシュを無効にして全リポジトリを再集計する"
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify GitHub token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_TOKEN is not set. Configure the 'GH_TOKEN' secret in repository settings."
            echo "Required permissions: pull-requests (read), actions (read)"
            exit 1
          fi
          echo "::group::gh auth status"
          gh auth status
          echo "::endgroup::"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Collect metrics
        run: pnpm run collect-metrics${{ inputs.no-cache == true && ' --no-cache' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PORTAL_CONFIG: ${{ secrets.PORTAL_CONFIG }}

      - name: Collect articles
        run: FETCH_ARTICLES=true pnpm exec astro sync

      - name: Format
        run: |
          pnpm exec biome format --write .
          pnpm run format:astro

      - name: Commit repository metrics if changed
        id: metrics_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/author-status.json src/data/articles/zenn.json src/data/articles/note.json src/data/repositories/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update repository metrics [skip ci]"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate activity data
        run: pnpm run generate-activity

      - name: Amend activity data and push
        id: activity_commit
        env:
          METRICS_COMMITTED: ${{ steps.metrics_commit.outputs.committed }}
        run: |
          activity_committed=false
          git add src/data/activity.json
          if git diff --cached --quiet; then
            echo "No activity changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          elif [ "$METRICS_COMMITTED" = "true" ]; then
            commit_date=$(git show -s --format=%cI HEAD)
            GIT_COMMITTER_DATE="$commit_date" git commit --amend --no-edit
            activity_committed=true
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update activity data [skip ci]"
            activity_committed=true
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$METRICS_COMMITTED" = "true" ] || [ "$activity_committed" = "true" ]; then
            git push origin main
          else
            echo "No changes to push"
          fi
